name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check assets/reelscope.js
      - run: python -m py_compile web_app.py web_app_cuda.py reelscope_desktop.pyw

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag reelscope:test .
      - run: >-
          docker run --detach --name reelscope-test
          --read-only --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777
          --tmpfs /data:rw,nosuid,nodev,size=1g,mode=0700,uid=10001,gid=10001
          --publish 127.0.0.1:18002:8000
          --env VIDEO_FRAMES_DATA_DIR=/data
          --env REELSCOPE_ALLOW_REGISTRATION=0
          --env REELSCOPE_TRUSTED_HOSTS=localhost,127.0.0.1
          reelscope:test
      - run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18002/healthz | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs reelscope-test
          exit 1
      - if: always()
        run: docker logs reelscope-test
